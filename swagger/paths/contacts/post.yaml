tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone"
            type: number
            example: +380965674565
          email:
            description: "Contact's email"
            type: string
            example: 'email@example.com'
          isFavourite:
            description: 'A value that indicates whether the contact is in favorites.'
            type: boolean
            example: false
          contactType:
            description: 'Describes the type of contact'
            type: array
            example: ['work', 'personal']
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/Contact.yaml'
  '401':
    $ref: ../../components/responses/UnauthorizedError.yaml
