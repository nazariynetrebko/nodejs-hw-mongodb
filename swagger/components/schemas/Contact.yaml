type: object
required:
  - _id
  - name
  - phoneNumber
  - isFavourite
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone"
    type: string
    example: '+380965674565'
  email:
    description: "Contact's email"
    type: string
    example: 'email@example.com'
  isFavourite:
    description: 'A value that indicates whether the contact is in favorites.'
    type: boolean
    example: false
  contactType:
    description: 'Describes the type of contact'
    type: string
    enum:
      - work
      - home
      - personal
    example: 'personal'
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
